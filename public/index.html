<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#141a3f">
  <meta name="color-scheme" content="dark light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="description" content="Cheese Thief: a cozy social deduction game for 4-8 friends, one phone each.">
  <title>Cheese Thief</title>
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preload" href="fonts/fredoka-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/main.js"></script>
</head>
<body data-mood="evening">
  <main id="app" aria-live="polite">
    <section class="screen center">
      <img class="art logo bob" src="img/logo.svg" alt="">
      <p class="muted">Loading…</p>
    </section>
  </main>
  <div id="toast" class="toast" role="status" hidden></div>
  <noscript><p class="center">Cheese Thief needs JavaScript turned on.</p></noscript>
</body>
</html>

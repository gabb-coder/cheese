<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 166" role="img" aria-label="A mouse in a bandit mask holding a wedge of cheese">
  <g stroke="#2b1d14" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- ears -->
    <circle cx="44" cy="44" r="26" fill="#b8afc9"/>
    <circle cx="44" cy="44" r="15" fill="#f4a7b9" stroke-width="0"/>
    <circle cx="116" cy="44" r="26" fill="#b8afc9"/>
    <circle cx="116" cy="44" r="15" fill="#f4a7b9" stroke-width="0"/>
    <!-- head -->
    <ellipse cx="80" cy="84" rx="44" ry="38" fill="#cdc6dc"/>
    <!-- bandit mask with knot -->
    <path d="M118 70 l20 -8 l-4 14 l8 10 l-22 -4" fill="#2b1d14"/>
    <rect x="34" y="62" width="92" height="26" rx="13" fill="#2b1d14"/>
  </g>
  <ellipse cx="62" cy="75" rx="9" ry="8" fill="#fff6e3"/>
  <ellipse cx="98" cy="75" rx="9" ry="8" fill="#fff6e3"/>
  <circle cx="64" cy="76" r="4.2" fill="#2b1d14"/>
  <circle cx="100" cy="76" r="4.2" fill="#2b1d14"/>
  <circle cx="65.5" cy="74.5" r="1.4" fill="#fff"/>
  <circle cx="101.5" cy="74.5" r="1.4" fill="#fff"/>
  <!-- cheeks, nose, grin -->
  <ellipse cx="50" cy="100" rx="8" ry="4.5" fill="#f4a7b9" opacity="0.7"/>
  <ellipse cx="110" cy="100" rx="8" ry="4.5" fill="#f4a7b9" opacity="0.7"/>
  <circle cx="80" cy="97" r="5.5" fill="#ef7f9c" stroke="#2b1d14" stroke-width="2.5"/>
  <path d="M70 106 q10 9 20 0" fill="none" stroke="#2b1d14" stroke-width="3" stroke-linecap="round"/>
  <g stroke="#6f6688" stroke-width="2" stroke-linecap="round">
    <path d="M58 99 l-22 -4"/><path d="M58 104 l-22 3"/><path d="M102 99 l22 -4"/><path d="M102 104 l22 3"/>
  </g>
  <!-- the stolen cheese -->
  <g stroke="#2b1d14" stroke-width="3.5" stroke-linejoin="round">
    <path d="M86 150 l42 -30 l18 30 z" fill="#ffc23d"/>
    <path d="M86 150 h60 v7 h-60 z" fill="#f0a91e"/>
  </g>
  <circle cx="114" cy="140" r="4" fill="#e59a12"/>
  <circle cx="128" cy="132" r="2.8" fill="#e59a12"/>
  <circle cx="132" cy="145" r="3" fill="#e59a12"/>
  <!-- paws holding it -->
  <ellipse cx="96" cy="140" rx="9" ry="7" fill="#cdc6dc" stroke="#2b1d14" stroke-width="3"/>
  <ellipse cx="140" cy="142" rx="8" ry="7" fill="#cdc6dc" stroke="#2b1d14" stroke-width="3"/>
</svg>
